name: Vercel Production Deployment

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      vercel-project-id:
        required: true
        type: string
      vercel-org-id:
        required: true
        type: string
      working-directory:
        required: false
        type: string
        default: "."
      node-version:
        required: false
        type: string
        default: "22"
      deploy-ref:
        required: false
        type: string
        default: ""
    secrets:
      VERCEL_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.project-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: vercel-production-${{ github.repository }}-${{ inputs.vercel-project-id }}
      cancel-in-progress: true
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
      VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
      NPM_CONFIG_IGNORE_SCRIPTS: "false"
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_ORG_ID:-}" ]; then
            echo "::error::VERCEL_ORG_ID is empty (matrix org_id / inputs.vercel-org-id)."
            exit 1
          fi
          if [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::error::VERCEL_PROJECT_ID is empty (matrix project_id)."
            exit 1
          fi
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is empty. Set org or repo Actions secret VERCEL_TOKEN to a long-lived Vercel token (https://vercel.com/account/tokens). Repo secrets override org secrets."
            exit 1
          fi

      # Fail fast with a clear message if the secret was overwritten with a dead token.
      - name: Verify VERCEL_TOKEN against Vercel API
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /tmp/vercel-user.json -w "%{http_code}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            https://api.vercel.com/v2/user || true)"
          if [ "${CODE}" != "200" ]; then
            echo "::error::VERCEL_TOKEN is rejected by Vercel (HTTP ${CODE}). Do not re-run platform configure-github without --force-token after rotating. Create a long-lived token at https://vercel.com/account/tokens and: gh secret set VERCEL_TOKEN --repo ${GITHUB_REPOSITORY}"
            exit 1
          fi
          # Never print token; username only if jq available, else skip.
          if command -v jq >/dev/null 2>&1; then
            echo "VERCEL_TOKEN ok (user=$(jq -r '.user.username // .username // "unknown"' /tmp/vercel-user.json))"
          else
            echo "VERCEL_TOKEN ok (HTTP 200)"
          fi
          rm -f /tmp/vercel-user.json

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy-ref != '' && inputs.deploy-ref || github.sha }}
          fetch-depth: 1

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable package managers
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@8.15.9
          npm config set ignore-scripts false
          echo "ignore-scripts=false" >> "$HOME/.npmrc"
          # bun - used by several org projects as installCommand
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          pnpm --version
          bun --version
          node --version

      - name: Install Vercel CLI
        shell: bash
        run: npm install --global vercel@54.21.1

      - name: Pull Vercel production configuration
        shell: bash
        run: |
          set -euo pipefail
          if ! vercel pull --yes --environment=production --token="$VERCEL_TOKEN"; then
            echo "::error::vercel pull failed. If the message mentions an invalid token, rotate VERCEL_TOKEN with a long-lived token and avoid configure-github overwrites (default now keeps existing secrets)."
            exit 1
          fi

      - name: Prepare install policy for local vercel build
        shell: bash
        run: |
          set -euo pipefail
          touch .npmrc
          grep -q '^ignore-scripts=' .npmrc || echo 'ignore-scripts=false' >> .npmrc
          # Ensure bun is on PATH for subsequent steps
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Build production application
        shell: bash
        env:
          BUN_INSTALL: ${{ github.workspace }}/../.bun
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production application
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          # Deployment Checks can hold this CLI call on "Running Checks…".
          # Fail clearly instead of hanging until the job timeout.
          set +e
          DEPLOYMENT_URL="$(timeout 720 vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          DEPLOY_EXIT=$?
          set -e
          if [ "${DEPLOY_EXIT}" -eq 124 ]; then
            echo "::error::vercel deploy timed out after 12m while Running Checks. Ensure a workflow listens for repository_dispatch type vercel.deployment.ready and reports the required Deployment Check, or Force Promote in the Vercel dashboard."
            exit 1
          fi
          if [ "${DEPLOY_EXIT}" -ne 0 ]; then
            exit "${DEPLOY_EXIT}"
          fi
          echo "deployment_url=${DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"
          {
            echo "### Production deployment"
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Project: \`${{ inputs.project-name }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${DEPLOYMENT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"