name: Vercel Production Deployment

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      vercel-project-id:
        required: true
        type: string
      vercel-org-id:
        required: true
        type: string
      working-directory:
        required: false
        type: string
        default: "."
      node-version:
        required: false
        type: string
        default: "22"
      deploy-ref:
        required: false
        type: string
        default: ""
    secrets:
      VERCEL_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.project-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: vercel-production-${{ github.repository }}-${{ inputs.vercel-project-id }}
      cancel-in-progress: true
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
      VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
      NPM_CONFIG_IGNORE_SCRIPTS: "false"
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_ORG_ID}"
          test -n "${VERCEL_PROJECT_ID}"
          test -n "${VERCEL_TOKEN}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy-ref != '' && inputs.deploy-ref || github.sha }}
          fetch-depth: 1

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable package managers
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@8.15.9
          npm config set ignore-scripts false
          echo "ignore-scripts=false" >> "$HOME/.npmrc"
          # bun - used by several org projects as installCommand
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          pnpm --version
          bun --version
          node --version

      - name: Install Vercel CLI
        shell: bash
        run: npm install --global vercel@54.21.1

      - name: Pull Vercel production configuration
        shell: bash
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Prepare install policy for local vercel build
        shell: bash
        run: |
          set -euo pipefail
          touch .npmrc
          grep -q '^ignore-scripts=' .npmrc || echo 'ignore-scripts=false' >> .npmrc
          # Ensure bun is on PATH for subsequent steps
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Build production application
        shell: bash
        env:
          BUN_INSTALL: ${{ github.workspace }}/../.bun
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production application
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "deployment_url=${DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"
          {
            echo "### Production deployment"
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Project: \`${{ inputs.project-name }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${DEPLOYMENT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"