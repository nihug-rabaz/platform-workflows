name: Vercel Production Deployment

on:
  workflow_call:
    inputs:
      project-name:
        description: Vercel project display name
        required: true
        type: string
      vercel-project-id:
        description: Vercel project id (prj_...)
        required: true
        type: string
      vercel-org-id:
        description: Vercel team or user id
        required: true
        type: string
      working-directory:
        description: Always repo root; Vercel project settings own rootDirectory
        required: false
        type: string
        default: "."
      node-version:
        description: Node.js version for the runner
        required: false
        type: string
        default: "22"
      deploy-ref:
        description: Git ref (branch, tag, or SHA) to checkout and deploy
        required: false
        type: string
        default: ""
    secrets:
      VERCEL_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.project-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: vercel-production-${{ github.repository }}-${{ inputs.vercel-project-id }}
      cancel-in-progress: true
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
      VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
      # Allow package install scripts (sharp, esbuild, prisma, etc.)
      NPM_CONFIG_IGNORE_SCRIPTS: "false"
      # pnpm: allow dependency build scripts (pnpm 9+/10 ignore them by default)
      npm_config_enable_pre_post_scripts: "true"
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_ORG_ID}"
          test -n "${VERCEL_PROJECT_ID}"
          test -n "${VERCEL_TOKEN}"
          test -n "${{ inputs.project-name }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy-ref != '' && inputs.deploy-ref || github.sha }}
          fetch-depth: 1

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable package managers
        shell: bash
        run: |
          set -euo pipefail
          # pnpm 8 does not fail on ignored native builds the way pnpm 9/10 do offline
          npm install --global pnpm@8.15.9
          if command -v corepack >/dev/null 2>&1; then
            corepack enable || true
          fi
          # Allow npm lifecycle scripts on npm 10/11 runners
          npm config set ignore-scripts false
          # pnpm: approve all dependency builds for CI production builds
          pnpm config set enable-pre-post-scripts true
          # Create a project-level .npmrc helpers that pnpm also honors
          {
            echo "ignore-scripts=false"
            echo "enable-pre-post-scripts=true"
          } >> "$HOME/.npmrc"
          pnpm --version
          node --version
          npm --version

      - name: Install Vercel CLI
        shell: bash
        run: npm install --global vercel@54.21.1

      - name: Pull Vercel production configuration
        shell: bash
        run: |
          set -euo pipefail
          # Always from repository root so Vercel rootDirectory is applied once
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Load production env into process (if present)
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE=".vercel/.env.production.local"
          if [ -f "$ENV_FILE" ]; then
            echo "Loaded production env file exists ($(wc -l < "$ENV_FILE") lines)"
          else
            echo "No .vercel/.env.production.local after pull"
          fi

      - name: Build production application
        shell: bash
        run: |
          set -euo pipefail
          # Ensure pnpm does not block dependency builds
          export CI=1
          if [ -f pnpm-lock.yaml ]; then
            # Write allow-builds for common packages if policy file missing
            if [ ! -f pnpm-workspace.yaml ] && [ ! -f package.json ]; then
              true
            fi
          fi
          # For pnpm lockfiles, create/update .npmrc to allow builds during vercel build's internal install
          if [ -f pnpm-lock.yaml ] || [ -f package.json ]; then
            touch .npmrc
            grep -q 'ignore-scripts' .npmrc || echo 'ignore-scripts=false' >> .npmrc
            grep -q 'enable-pre-post-scripts' .npmrc || echo 'enable-pre-post-scripts=true' >> .npmrc
            # pnpm 9+ style allow all builds when present
            grep -q 'dangerouslyAllowAllBuilds' .npmrc || echo 'dangerouslyAllowAllBuilds=true' >> .npmrc
          fi
          vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production application
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "deployment_url=${DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"
          {
            echo "### Production deployment"
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Project: \`${{ inputs.project-name }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${DEPLOYMENT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"